name: CI

on:
    push:
    pull_request:

# Testkit je to, čím si agentové balíky overujú schopnosť nasadenia — keď je pokazený on,
# pokazí sa overovanie všetkých ostatných, a to tichšie, než by malo.
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            # LEONESS_COMPOSER_TOKEN je org secret: fine-grained PAT machine účtu,
            # oprávnenie iba Contents:read na agent repá.
            # Dva spôsoby, lebo composer má dve cesty k privátnemu repozitáru a token musí
            # fungovať na oboch: `github-oauth` pokrýva GitHub API (rýchle zip sťahovanie),
            # `insteadOf` pokrýva `git clone`, na ktorý composer prepadne, keď API odpovie
            # 404 — a tam GitHub fine-grained token ako *heslo* neprijme
            # ("Password authentication is not supported for Git operations"). Formát
            # x-access-token:<token> je ten, ktorý podporuje; rovnaký používa aj platforma
            # v App\Packaging\Provision\GitWorkspace.
            # Iba git, zámerne bez `composer config github-oauth`. Composer si s ním totiž
            # skladá URL sám (`https://<token>:x-oauth-basic@github.com/…`) a tým prebije
            # `insteadOf` — a GitHub v tomto tvare fine-grained token odmieta:
            # "Invalid username or token. Password authentication is not supported for Git
            # operations." Tvar, ktorý prijíma, je x-access-token:<token>, a ten sa uplatní
            # len vtedy, keď composer žiadne vlastné prihlásenie nemá a nechá URL tak.
            # Repozitáre balíkov majú preto aj `"no-api": true` — bez neho by composer šiel
            # cez GitHub API, dostal 404 a prepadol späť na git až po zbytočnom kole.
            - name: Git auth na privátne leoness/* repozitáre
              run: git config --global url."https://x-access-token:${{ secrets.LEONESS_COMPOSER_TOKEN }}@github.com/".insteadOf "https://github.com/"

            - name: Validate
              run: composer validate --strict

            - name: Install
              run: composer install --no-interaction --no-progress

            - name: Lint
              run: find src bin -name '*.php' -print0 | xargs -0 -n1 php -l
